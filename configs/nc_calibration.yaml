# ============================================================================
# Neural Cleanse threshold calibration (outputs experiments/phase7b/)
# ============================================================================

seed: 42

n_holdouts: 6            # random clean holdouts of equal size (variance source)
holdout_size: 3000
nc_steps: 400            # slightly lighter than 500 for the many NC runs
nc_lr: 0.1

# Decision-rule thresholds (paired calibration).
z_threshold: 3.0        # flag if (ratio - mean_ref) / std_ref > 3
rel_threshold: 2.0      # flag if ratio / median_ref > 2
abs_threshold: 3.688    # earlier absolute threshold from image_baseline.yaml step 0 (comparator)

# All available CLEAN and POISONED IDS models (no retraining).
clean_seeds: [43, 44, 45, 46, 47]          # + clean_seed42 (clean_mlp.pt)
poison_rates: [0.005, 0.01, 0.02, 0.05, 0.1]
poison_seeds: [43, 44, 45, 46, 47]         # multi-seed backdoored models (p0.05)
trigger_variants: [nfeat2, nfeat6, nfeat8, altfeat, subtle]

paths:
  processed_dir: data/processed
  models_dir: results/models
  experiment_dir: experiments/phase7b
